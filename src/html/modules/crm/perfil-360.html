<div class="split-layout-3">
  <div class="stack-sm" data-ref="guests-list"></div>
  <div data-ref="detail-slot"></div>
</div>

<template data-tpl="item-huesped-lista">
  <button type="button" class="card p-3 w-full text-left" style="width: 100%; text-align: left; cursor: pointer;">
    <div class="row-between">
      <span class="font-semibold text-xs text-navy" data-ref="name"></span>
      <span class="font-mono text-11 text-teal font-semibold" data-ref="tier"></span>
    </div>
    <div class="text-11 text-slate-500 mt-1" data-ref="meta"></div>
  </button>
</template>

<template data-tpl="detalle-huesped-360">
  <div class="card card-pad stack-md">
    <div class="row-between border-b pb-3">
      <div>
        <div class="text-xs font-semibold text-teal" data-ref="segment-tier"></div>
        <h2 class="text-lg font-bold text-navy" data-ref="full-name"></h2>
        <div class="text-11 text-slate-500 font-mono mt-0.5" data-ref="contact-pii"></div>
      </div>
      <div data-ref="consent-status"></div>
    </div>

    <div class="grid-3" data-ref="kpis"></div>

    <div>
      <h3 class="text-xs font-bold text-navy mb-1">Preferencias registradas</h3>
      <div class="text-xs text-slate-600" data-ref="preferences"></div>
      <div class="mt-1 text-11 text-slate-500 hidden" data-ref="notes"></div>
    </div>

    <div class="grid-2">
      <div>
        <h3 class="text-xs font-bold text-navy mb-2" data-ref="res-title"></h3>
        <div class="stack-xs" data-ref="res-folio-list"></div>
      </div>
      <div>
        <h3 class="text-xs font-bold text-navy mb-2" data-ref="comp-title"></h3>
        <div class="stack-xs" data-ref="comp-list"></div>
      </div>
    </div>
  </div>
</template>

<template data-tpl="item-huesped-reserva">
  <div class="p-2.5 bg-subtle border rounded-md row-between text-xs">
    <span class="font-mono font-medium text-navy" data-ref="label"></span>
    <span class="font-mono text-navy" data-ref="amount"></span>
  </div>
</template>

<template data-tpl="item-huesped-folio">
  <div class="p-2.5 bg-teal-soft border rounded-md row-between text-xs">
    <span class="font-mono font-medium text-navy" data-ref="label"></span>
    <span class="font-mono font-semibold text-teal-dark" data-ref="balance"></span>
  </div>
</template>

<template data-tpl="item-huesped-reclamo">
  <div class="p-2.5 bg-subtle border rounded-md stack-xs text-xs">
    <div class="row-between">
      <span class="font-mono font-semibold text-navy" data-ref="code"></span>
      <div data-ref="status"></div>
    </div>
    <div class="text-11 text-slate-600" data-ref="desc"></div>
  </div>
</template>
