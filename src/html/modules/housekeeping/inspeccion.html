<div class="grid-2 items-start">
  <div class="card card-pad stack-md">
    <div>
      <div class="row-gap-sm">
        <span data-ref="form-icon"></span>
        <h2 class="card-title">Registrar Inspección de Calidad</h2>
      </div>
      <p class="card-subtitle mt-1">Aprobar la inspección marca la habitación como Inspeccionada y la habilita automáticamente para Check-in en Recepción.</p>
    </div>

    <div>
      <label class="field-label">Habitación a inspeccionar</label>
      <select class="select-control text-xs" data-ref="room-select"></select>
    </div>

    <div class="stack-xs">
      <label class="field-label">Checklist de verificación:</label>
      <label class="checkbox-row p-2.5 border rounded-md">
        <input type="checkbox" checked data-check="ropaCama" />
        <span>Ropa de cama tendida y blancos impecables</span>
      </label>
      <label class="checkbox-row p-2.5 border rounded-md">
        <input type="checkbox" checked data-check="banoSanitizado" />
        <span>Baño sanitizado, espejos y pisos sin humedad</span>
      </label>
      <label class="checkbox-row p-2.5 border rounded-md">
        <input type="checkbox" checked data-check="minibarRepuesto" />
        <span>Minibar verificado y repuesto</span>
      </label>
      <label class="checkbox-row p-2.5 border rounded-md">
        <input type="checkbox" checked data-check="amenitiesCompletos" />
        <span>Amenities orgánicos y toallas completos</span>
      </label>
      <label class="checkbox-row p-2.5 border rounded-md">
        <input type="checkbox" checked data-check="equiposOperativos" />
        <span>Aire acondicionado, TV, luces y cerradura operativos</span>
      </label>
    </div>

    <div>
      <label class="field-label">Observaciones</label>
      <textarea rows="2" class="textarea-control" placeholder="Detalle de conformidad o hallazgos..." data-ref="observations"></textarea>
    </div>

    <div class="row-wrap justify-end gap-2 hidden" data-ref="actions">
      <button type="button" class="btn btn-danger-outline btn-sm" data-ref="reject-btn">Rechazar a Sucia</button>
      <button type="button" class="btn btn-teal btn-sm" data-ref="approve-btn">
        <span data-ref="check-icon"></span>
        <span>Aprobar Inspección</span>
      </button>
    </div>
  </div>

  <div class="card card-pad stack-md">
    <h2 class="card-title">Historial de Inspecciones Recientes</h2>
    <div class="divide-y" data-ref="history-list"></div>
  </div>
</div>

<template data-tpl="fila-historial-inspeccion">
  <div class="py-3 row-between items-start">
    <div>
      <div class="font-mono text-xs font-bold text-navy" data-ref="room"></div>
      <div class="text-xs text-slate-600 mt-0.5" data-ref="obs"></div>
      <div class="text-11 text-slate-400 mt-0.5" data-ref="meta"></div>
    </div>
    <div data-ref="result"></div>
  </div>
</template>
