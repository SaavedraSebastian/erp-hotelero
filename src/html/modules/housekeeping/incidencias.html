<div class="stack-md">
  <div class="row-between hidden" data-ref="top-bar">
    <h2 class="card-title">Incidencias Reportadas</h2>
    <button type="button" class="btn btn-primary btn-sm hidden" data-ref="new-btn">
      <span data-ref="plus-icon"></span>
      <span>Reportar incidencia</span>
    </button>
  </div>

  <div class="card">
    <div class="table-scroll">
      <table class="erp-table">
        <thead>
          <tr>
            <th>Código / Ubicación</th>
            <th>Categoría y Descripción</th>
            <th>Prioridad</th>
            <th>Estado</th>
            <th class="text-right hidden" data-ref="actions-th">Acción</th>
          </tr>
        </thead>
        <tbody data-ref="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<template data-tpl="fila-incidencia">
  <tr>
    <td>
      <div class="font-mono font-bold text-navy" data-ref="code"></div>
      <div class="text-xs text-slate-600" data-ref="location"></div>
      <div class="text-11 text-teal font-medium hidden" data-ref="crm-link">Vinculado a CRM</div>
    </td>
    <td>
      <div class="text-xs font-semibold text-navy" data-ref="category"></div>
      <div class="text-xs text-slate-600" data-ref="desc"></div>
      <div class="text-11 text-slate-400 mt-0.5" data-ref="reporter"></div>
    </td>
    <td data-ref="priority"></td>
    <td data-ref="status"></td>
    <td class="text-right hidden" data-ref="action"></td>
  </tr>
</template>
