<div class="stack-md">
  <div class="row-between">
    <div data-ref="filters-slot"></div>
    <button type="button" class="btn btn-primary btn-sm hidden" data-ref="new-btn">
      <span data-ref="plus-icon"></span>
      <span>Nueva orden</span>
    </button>
  </div>

  <div class="card">
    <div class="table-scroll" data-ref="table-wrap"></div>
    <div data-ref="footer-slot"></div>
  </div>
</div>

<template data-tpl="tabla-limpieza">
  <table class="erp-table">
    <thead>
      <tr>
        <th>Habitación / Tipo</th>
        <th>Prioridad</th>
        <th>Responsable</th>
        <th>Origen / Notas</th>
        <th>Estado</th>
        <th class="text-right hidden" data-ref="actions-th">Acciones</th>
      </tr>
    </thead>
    <tbody data-ref="tbody"></tbody>
  </table>
</template>

<template data-tpl="fila-limpieza">
  <tr>
    <td>
      <div class="font-mono font-bold text-navy" data-ref="room"></div>
      <div class="text-11 text-slate-500" data-ref="type"></div>
    </td>
    <td data-ref="priority"></td>
    <td class="text-xs text-slate-700" data-ref="staff"></td>
    <td>
      <div class="text-11 font-medium text-teal hidden" data-ref="origin"></div>
      <div class="text-xs text-slate-600" data-ref="notes"></div>
    </td>
    <td data-ref="status"></td>
    <td class="text-right hidden" data-ref="actions">
      <div class="row-wrap justify-end">
        <button type="button" class="btn btn-outline btn-xs hidden" data-ref="start-btn">Iniciar</button>
        <button type="button" class="btn btn-teal btn-xs hidden" data-ref="finish-btn">Finalizar</button>
      </div>
    </td>
  </tr>
</template>
