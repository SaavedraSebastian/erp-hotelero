<div class="module-templates" hidden>
  <template data-tpl="modal-limpieza">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Habitación</label>
          <select class="select-control" data-ref="roomId"></select>
        </div>
        <div>
          <label class="field-label">Tipo</label>
          <select class="select-control" data-ref="type">
            <option value="Salida (Check-out)">Salida (Check-out)</option>
            <option value="Estadía">Estadía</option>
            <option value="Profunda">Profunda</option>
          </select>
        </div>
        <div>
          <label class="field-label">Prioridad</label>
          <select class="select-control" data-ref="priority">
            <option value="Urgente">Urgente</option>
            <option value="Alta" selected>Alta</option>
            <option value="Media">Media</option>
          </select>
        </div>
        <div>
          <label class="field-label">Personal asignado</label>
          <select class="select-control" data-ref="assignedStaffId"></select>
        </div>
      </div>
      <div>
        <label class="field-label">Notas</label>
        <textarea rows="2" class="textarea-control" data-ref="notes"></textarea>
      </div>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Crear orden</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-incidencia">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Habitación</label>
          <select class="select-control" data-ref="roomId"></select>
        </div>
        <div>
          <label class="field-label">Equipo / activo</label>
          <select class="select-control" data-ref="assetId"></select>
        </div>
        <div>
          <label class="field-label">Ubicación</label>
          <input class="input-control" readonly placeholder="Se completa al elegir habitación o equipo" data-ref="location" />
        </div>
        <div>
          <label class="field-label">Prioridad</label>
          <select class="select-control" data-ref="priority">
            <option value="Alta">Alta</option>
            <option value="Media" selected>Media</option>
            <option value="Baja">Baja</option>
          </select>
        </div>
        <div>
          <label class="field-label">Reportado por</label>
          <select class="select-control" data-ref="origin">
            <option value="Personal">Personal</option>
            <option value="Supervisor">Supervisor</option>
            <option value="Huésped">Huésped</option>
          </select>
        </div>
      </div>
      <div>
        <label class="field-label">Descripción detallada</label>
        <textarea rows="3" required maxlength="300" class="textarea-control" data-ref="description"></textarea>
        <div class="text-11 text-slate-400 mt-1 text-right" data-ref="counter">0 / 300</div>
      </div>
      <p class="text-11 text-slate-500">Indica una habitación, un equipo o ambos.</p>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Registrar incidencia</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-completar-ot">
    <form class="stack-md">
      <div>
        <label class="field-label">Trabajo realizado</label>
        <textarea rows="3" required class="textarea-control" placeholder="Describe la reparación ejecutada..." data-ref="notes"></textarea>
      </div>
      <div>
        <label class="field-label">Repuestos utilizados</label>
        <input class="input-control" placeholder="Ej. Sensor NTC, válvula 1/2&quot;" data-ref="parts" />
      </div>
      <div class="grid-2">
        <div>
          <label class="field-label">Horas trabajadas</label>
          <input type="number" min="0" step="0.5" required class="input-control font-mono" data-ref="hours" />
        </div>
        <div>
          <label class="field-label">Costo total (S/)</label>
          <input type="number" min="0" step="0.01" required class="input-control font-mono" data-ref="cost" />
        </div>
      </div>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-teal">Marcar Completada</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-preventivo">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Activo / Equipo</label>
          <select class="select-control" required data-ref="asset"></select>
        </div>
        <div>
          <label class="field-label">Frecuencia</label>
          <select class="select-control" data-ref="frequency"><option value="Semanal">Semanal</option><option value="Mensual" selected>Mensual</option><option value="Trimestral">Trimestral</option><option value="Anual">Anual</option></select>
        </div>
        <div>
          <label class="field-label">Próxima fecha (opcional)</label>
          <input type="date" class="input-control" data-ref="nextDate" />
        </div>
      </div>
        <div>
          <label class="field-label">Tarea de mantenimiento</label>
          <input class="input-control" required minlength="5" maxlength="150" data-ref="notes" />
        </div>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Programar revisión</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-activo">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Nombre del activo</label>
          <input class="input-control" required data-ref="name" />
        </div>
        <div>
          <label class="field-label">Tipo de activo</label>
          <select class="select-control" data-ref="type"></select>
        </div>
        <div>
          <label class="field-label">Ubicación (habitación o área)</label>
          <select class="select-control" data-ref="location"></select>
        </div>
        <div>
          <label class="field-label">Marca</label>
          <input class="input-control" maxlength="30" data-ref="brand" />
        </div>
        <div>
          <label class="field-label">Modelo</label>
          <input class="input-control" maxlength="30" data-ref="model" />
        </div>
        <div>
          <label class="field-label">Fecha de instalación</label>
          <input type="date" class="input-control" data-ref="installDate" />
        </div>
        <div>
          <label class="field-label">Horas de uso</label>
          <input type="number" min="0" step="1" class="input-control font-mono" data-ref="hoursUsed" />
        </div>
        <div>
          <label class="field-label">Estado</label>
          <select class="select-control" data-ref="condition"><option value="Operativo">Operativo</option><option value="En reparación">En reparación</option><option value="Dado de baja">Dado de baja</option></select>
        </div>
      </div>
      <p class="text-11 text-slate-500">El código (ACT-nnnnn) lo asigna la base de datos. El riesgo de falla lo calcula el modelo predictivo.</p>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar activo</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-requisicion">
    <form class="stack-md">
      <div>
        <label class="field-label" data-ref="qty-label"></label>
        <input type="number" min="1" class="input-control font-mono" data-ref="qty" />
      </div>
      <div>
        <label class="field-label">Justificación</label>
        <textarea rows="2" class="textarea-control" data-ref="notes"></textarea>
      </div>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-teal">Enviar solicitud a Almacén</button>
      </div>
    </form>
  </template>
</div>
