<div class="stack-md">
  <div class="grid-3" data-ref="tables-grid"></div>

  <div class="card">
    <div class="card-header">
      <h3 class="card-title row-gap-sm">
        <span data-ref="monitor-icon"></span>
        <span>Monitor de Comandas y Pedidos</span>
      </h3>
    </div>
    <div class="divide-list" data-ref="orders-list"></div>
  </div>
</div>

<template data-tpl="card-mesa">
  <div class="card card-pad stack-xs">
    <div class="row-between items-start">
      <div>
        <div class="text-sm font-bold text-navy" data-ref="title"></div>
        <div class="text-11 text-slate-500 mt-0.5" data-ref="meta"></div>
      </div>
      <div data-ref="status"></div>
    </div>
    <div class="text-11 font-medium text-navy pt-1 hidden" data-ref="room-label"></div>
    <select class="select-control text-xs mt-1 hidden" data-ref="status-select">
      <option value="Libre">Libre</option>
      <option value="Ocupada">Ocupada</option>
      <option value="Reservada">Reservada</option>
    </select>
  </div>
</template>

<template data-tpl="fila-comanda-restaurante">
  <div class="p-4 row-between">
    <div>
      <div class="font-mono text-xs font-bold text-navy" data-ref="title"></div>
      <div class="text-11 text-slate-500 mt-0.5" data-ref="items"></div>
    </div>
    <div class="row-gap-sm">
      <span class="font-mono font-semibold text-navy" data-ref="total"></span>
      <div data-ref="status"></div>
      <button type="button" class="btn btn-teal btn-xs hidden" data-ref="action-btn"></button>
    </div>
  </div>
</template>
