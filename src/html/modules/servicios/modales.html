<div class="module-templates" hidden>
  <template data-tpl="modal-producto">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Nombre</label>
          <input class="input-control" required data-ref="name" />
        </div>
        <div>
          <label class="field-label">Punto de venta</label>
          <select class="select-control" data-ref="pos"></select>
        </div>
        <div>
          <label class="field-label">Categoría de carta</label>
          <select class="select-control" data-ref="category"></select>
        </div>
        <div>
          <label class="field-label">Tipo</label>
          <select class="select-control" data-ref="itemType"><option value="plato">Plato</option><option value="bebida">Bebida</option><option value="producto">Producto</option></select>
        </div>
        <div>
          <label class="field-label">Precio de venta (S/)</label>
          <input type="number" step="0.01" min="0" class="input-control font-mono" required data-ref="price" />
        </div>
        <div>
          <label class="field-label">Artículo de almacén que descuenta stock</label>
          <select class="select-control" data-ref="article"></select>
        </div>
      </div>
      <p class="text-11 text-slate-500">Si el producto se prepara con receta, deja el artículo en &quot;Ninguno&quot; y configura la receta aparte. El costo se calcula con los insumos.</p>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar producto</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-servicio">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Nombre del servicio</label>
          <input class="input-control" required data-ref="name" />
        </div>
        <div>
          <label class="field-label">Punto de venta</label>
          <select class="select-control" data-ref="pos"></select>
        </div>
        <div>
          <label class="field-label">Categoría</label>
          <select class="select-control" data-ref="category"></select>
        </div>
        <div>
          <label class="field-label">Duración (min, opcional)</label>
          <input type="number" min="1" class="input-control font-mono" placeholder="Ej. 60" data-ref="duration" />
        </div>
        <div>
          <label class="field-label">Tarifa (S/)</label>
          <input type="number" step="0.01" min="0" class="input-control font-mono" required data-ref="price" />
        </div>
      </div>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar servicio</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-kardex">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Tipo movimiento</label>
          <select class="select-control" data-ref="type">
            <option value="Entrada">Entrada</option>
            <option value="Salida">Salida</option>
            <option value="Ajuste">Ajuste</option>
          </select>
        </div>
        <div>
          <label class="field-label" data-ref="qty-label">Cantidad</label>
          <input type="number" step="0.5" min="0.5" class="input-control font-mono" data-ref="qty" />
        </div>
      </div>
      <div>
        <label class="field-label">Referencia</label>
        <input class="input-control" data-ref="ref" />
      </div>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Registrar movimiento</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-insumo">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Nombre del artículo</label>
          <input class="input-control" required data-ref="name" />
        </div>
        <div>
          <label class="field-label">Categoría</label>
          <select class="select-control" data-ref="category"></select>
        </div>
        <div>
          <label class="field-label">Unidad de medida</label>
          <select class="select-control" data-ref="unit"></select>
        </div>
        <div>
          <label class="field-label">Stock mínimo</label>
          <input type="number" min="0" step="0.5" class="input-control font-mono" required data-ref="min-stock" />
        </div>
        <div>
          <label class="field-label">Stock inicial</label>
          <input type="number" min="0" step="0.5" class="input-control font-mono" data-ref="stock" />
        </div>
        <div>
          <label class="field-label">Costo unitario (S/)</label>
          <input type="number" step="0.01" min="0" class="input-control font-mono" data-ref="unit-cost" />
        </div>
        <div>
          <label class="field-label">¿Vence?</label>
          <label class="row-wrap"><input type="checkbox" data-ref="expires" /> Sí, controla vencimiento</label>
        </div>
        <div>
          <label class="field-label">Vencimiento del stock inicial</label>
          <input type="date" class="input-control" data-ref="expiry" />
        </div>
        <div>
          <label class="field-label">Días de aviso de vencimiento</label>
          <input type="number" min="0" max="365" class="input-control font-mono" data-ref="warn-days" />
        </div>
      </div>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Crear artículo</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-proveedor">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Razón social</label>
          <input class="input-control" required data-ref="name" />
        </div>
        <div>
          <label class="field-label">RUC</label>
          <input class="input-control font-mono" required data-ref="ruc" />
        </div>
        <div>
          <label class="field-label">Teléfono</label>
          <input class="input-control" data-ref="phone" />
        </div>
        <div>
          <label class="field-label">Correo</label>
          <input type="email" class="input-control" data-ref="email" />
        </div>
      </div>
      <p class="text-11 text-slate-500">Se requiere al menos un teléfono o un correo de contacto.</p>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar proveedor</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-orden-compra">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Proveedor</label>
          <select class="select-control" data-ref="supplier"></select>
        </div>
        <div>
          <label class="field-label">Insumo de Almacén</label>
          <select class="select-control" data-ref="item"></select>
        </div>
        <div>
          <label class="field-label">Cantidad a comprar</label>
          <input type="number" min="1" class="input-control font-mono" data-ref="qty" />
        </div>
        <div>
          <label class="field-label">Costo unitario (S/)</label>
          <input type="number" step="0.5" min="1" class="input-control font-mono" data-ref="unit-cost" />
        </div>
      </div>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Emitir Orden de Compra</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-receta">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Producto de carta</label>
          <select class="select-control" data-ref="product"></select>
        </div>
        <div>
          <label class="field-label">Precio de venta (S/)</label>
          <input type="number" class="input-control font-mono" readonly data-ref="sale-price" />
        </div>
        <div>
          <label class="field-label">Ingrediente principal</label>
          <select class="select-control" data-ref="ing1"></select>
        </div>
        <div>
          <label class="field-label">Cantidad por porción</label>
          <input type="number" step="0.01" min="0.01" class="input-control font-mono" required data-ref="ing1-qty" />
        </div>
        <div>
          <label class="field-label">Segundo ingrediente (opcional)</label>
          <select class="select-control" data-ref="ing2"></select>
        </div>
        <div>
          <label class="field-label">Cantidad por porción</label>
          <input type="number" step="0.01" min="0" class="input-control font-mono" data-ref="ing2-qty" />
        </div>
      </div>
      <p class="text-11 text-slate-500">Guardar crea una nueva versión vigente; la anterior queda en el historial.</p>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar receta</button>
      </div>
    </form>
  </template>
</div>
