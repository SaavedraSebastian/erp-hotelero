<div class="split-layout-3">
  <form class="card card-pad stack-md" data-ref="min-form">
    <div>
      <h3 class="card-title">Registrar Consumo de Minibar</h3>
      <p class="card-subtitle mt-1">Descuenta stock directo del almacén y sincroniza automáticamente con el Folio del huésped.</p>
    </div>

    <div>
      <label class="field-label">Habitación ocupada</label>
      <select class="select-control text-xs" data-ref="room-select"></select>
    </div>

    <div>
      <label class="field-label">Ítem Minibar</label>
      <select class="select-control text-xs" data-ref="product-select"></select>
    </div>

    <div>
      <label class="field-label">Cantidad</label>
      <input type="number" min="1" value="1" class="input-control text-xs" data-ref="qty" />
    </div>

    <button type="submit" class="btn btn-teal w-full hidden" data-ref="submit-btn">Registrar Consumo Minibar</button>
  </form>

  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Consumos de Minibar Registrados</h3>
    </div>
    <div class="divide-list" data-ref="orders-list"></div>
  </div>
</div>

<template data-tpl="fila-pedido-minibar">
  <div class="p-4 row-between">
    <div>
      <div class="font-mono text-xs font-bold text-navy" data-ref="title"></div>
      <div class="text-11 text-slate-500 mt-0.5" data-ref="items"></div>
    </div>
    <span class="font-mono font-bold text-navy" data-ref="total"></span>
  </div>
</template>
