<div class="stack-md">
  <form class="card card-pad row-between gap-3" data-ref="report-form">
    <div class="row-wrap">
      <div><label class="field-label">Desde</label><input type="date" class="input-control" required data-ref="from" /></div>
      <div><label class="field-label">Hasta</label><input type="date" class="input-control" required data-ref="to" /></div>
    </div>
    <div class="row-wrap">
      <button type="button" class="btn btn-outline" data-ref="print-btn">Imprimir / Guardar PDF</button>
      <button type="submit" class="btn btn-primary">Actualizar reporte</button>
    </div>
  </form>

  <div class="grid-3" data-ref="summary"></div>

  <div class="grid-2">
    <div class="card"><div class="card-header"><h3 class="card-title">Ventas por punto de venta</h3></div><div class="divide-list" data-ref="sales"></div></div>
    <div class="card"><div class="card-header"><h3 class="card-title">Demanda de productos y servicios</h3></div><div class="divide-list" data-ref="demand"></div></div>
    <div class="card"><div class="card-header"><h3 class="card-title">Mermas y pérdidas</h3></div><div class="divide-list" data-ref="waste"></div></div>
    <div class="card"><div class="card-header"><h3 class="card-title">Resultados de recomendaciones IA</h3></div><div class="divide-list" data-ref="recommendations"></div></div>
  </div>
</div>

<template data-tpl="report-row">
  <div class="p-4 row-between gap-3"><div><div class="text-xs font-semibold text-navy" data-ref="title"></div><div class="text-11 text-slate-500" data-ref="meta"></div></div><div class="font-mono font-semibold text-navy" data-ref="value"></div></div>
</template>
