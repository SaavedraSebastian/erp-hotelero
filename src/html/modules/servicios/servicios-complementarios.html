<div class="split-layout-3">
  <form class="card card-pad stack-md" data-ref="srv-form">
    <h3 class="card-title">Registrar Solicitud de Servicio</h3>

    <div>
      <label class="field-label">Servicio</label>
      <select class="select-control text-xs" data-ref="service-select"></select>
    </div>

    <div>
      <label class="field-label">Habitación ocupada</label>
      <select class="select-control text-xs" data-ref="room-select"></select>
    </div>

    <div class="grid-2">
      <div>
        <label class="field-label">Cantidad</label>
        <input type="number" min="1" value="1" class="input-control font-mono" data-ref="quantity" />
      </div>
      <div>
        <label class="field-label">Fecha prevista</label>
        <input type="datetime-local" class="input-control" data-ref="scheduled-at" />
      </div>
    </div>

    <button type="submit" class="btn btn-teal w-full hidden" data-ref="submit-btn">Registrar Solicitud</button>
  </form>

  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Tarifario Activo de Servicios</h3>
    </div>
    <div class="divide-list" data-ref="services-list"></div>
    <div data-ref="services-footer"></div>
  </div>
</div>

<div class="card mt-4">
  <div class="card-header">
    <div>
      <h3 class="card-title">Monitor de Solicitudes de Servicio</h3>
      <p class="text-11 text-slate-500">Solicitudes pendientes, en atención, completadas y canceladas.</p>
    </div>
  </div>
  <div class="divide-list" data-ref="requests-list"></div>
</div>

<template data-tpl="fila-tarifa-servicio">
  <div class="p-4 row-between">
    <div>
      <div class="text-xs font-semibold text-navy">
        <span data-ref="name"></span>
        <span class="text-slate-400"> · </span>
        <span class="text-teal" data-ref="area"></span>
      </div>
      <div class="text-11 text-slate-500 mt-0.5" data-ref="desc"></div>
    </div>
    <span class="font-mono font-semibold text-navy shrink-0" data-ref="price"></span>
  </div>
</template>

<template data-tpl="fila-solicitud-servicio">
  <div class="p-4 row-between gap-3">
    <div class="min-w-0">
      <div class="text-xs font-semibold text-navy" data-ref="title"></div>
      <div class="text-11 text-slate-500 mt-0.5" data-ref="meta"></div>
    </div>
    <div class="row-wrap justify-end shrink-0">
      <span data-ref="status"></span>
      <button type="button" class="btn btn-outline btn-sm hidden" data-ref="start-btn">Iniciar</button>
      <button type="button" class="btn btn-teal btn-sm hidden" data-ref="complete-btn">Completar</button>
      <button type="button" class="btn btn-outline-muted btn-sm hidden" data-ref="cancel-btn">Cancelar</button>
    </div>
  </div>
</template>
