<div class="stack-md">
  <div class="row-wrap gap-3">
    <div data-ref="search-slot"></div>
    <select class="select-control text-xs" style="width:auto;min-width:11rem" data-ref="status-select">
      <option value="Todas">Todos los estados</option>
      <option value="Confirmada">Confirmada</option>
      <option value="Check-in">Check-in</option>
      <option value="Check-out">Check-out</option>
      <option value="Pendiente">Pendiente</option>
      <option value="Cancelada">Cancelada</option>
      <option value="No-Show">No-Show</option>
    </select>
  </div>

  <div class="card">
    <div class="table-scroll" data-ref="table-wrap"></div>
  </div>
</div>

<template data-tpl="tabla-reservas">
  <table class="erp-table">
    <thead>
      <tr>
        <th>Código / Canal</th>
        <th>Huésped</th>
        <th>Habitación</th>
        <th>Fechas</th>
        <th class="text-right">Total</th>
        <th>Estado</th>
        <th class="text-right">Acciones</th>
      </tr>
    </thead>
    <tbody data-ref="tbody"></tbody>
  </table>
</template>

<template data-tpl="fila-reserva">
  <tr>
    <td>
      <div class="font-mono font-bold text-navy" data-ref="code"></div>
      <div class="text-11 text-slate-500" data-ref="channel"></div>
    </td>
    <td>
      <div class="font-semibold text-navy" data-ref="guest"></div>
      <div class="text-11 text-slate-500" data-ref="pax"></div>
    </td>
    <td class="font-mono text-xs text-slate-700" data-ref="room"></td>
    <td class="font-mono text-xs text-slate-600" data-ref="stay"></td>
    <td class="text-right font-mono font-bold text-navy" data-ref="total"></td>
    <td data-ref="status"></td>
    <td class="text-right">
      <div class="row-wrap justify-end">
        <button type="button" class="btn btn-outline btn-xs" title="Ver trazabilidad" data-ref="history-btn"></button>
        <button type="button" class="btn btn-danger-outline btn-xs hidden" data-ref="cancel-btn">Cancelar</button>
        <button type="button" class="btn btn-outline-muted btn-xs hidden" data-ref="noshow-btn">No-Show</button>
      </div>
    </td>
  </tr>
</template>
