<div class="stack-md">
  <div class="row-between">
    <div data-ref="filters-slot"></div>
    <button type="button" class="btn btn-primary btn-sm hidden" data-ref="new-waitlist-btn">
      <span data-ref="plus-icon"></span>
      <span>Registrar en lista de espera</span>
    </button>
  </div>

  <div class="card">
    <div class="table-scroll" data-ref="table-wrap"></div>
    <div data-ref="footer-slot"></div>
  </div>
</div>

<template data-tpl="tabla-espera">
  <table class="erp-table">
    <thead>
      <tr>
        <th>Registro</th>
        <th>Solicitante</th>
        <th>Categoría y estadía</th>
        <th>Estado</th>
        <th class="text-right">Acciones</th>
      </tr>
    </thead>
    <tbody data-ref="tbody"></tbody>
  </table>
</template>

<template data-tpl="fila-espera">
  <tr>
    <td>
      <div data-ref="conflict-badge"></div>
      <div class="font-mono text-11 text-slate-400 mt-0.5" data-ref="created-at"></div>
    </td>
    <td>
      <div class="font-semibold text-navy" data-ref="guest"></div>
      <div class="text-11 text-slate-500" data-ref="contact"></div>
    </td>
    <td>
      <div class="text-xs font-medium text-navy" data-ref="room-type"></div>
      <div class="font-mono text-11 text-slate-500" data-ref="dates"></div>
    </td>
    <td>
      <div data-ref="status-badge"></div>
      <div class="text-11 text-slate-500 mt-0.5 hidden" data-ref="auth-note"></div>
    </td>
    <td class="text-right" data-ref="resolution"></td>
  </tr>
</template>
