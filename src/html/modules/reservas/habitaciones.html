<div class="stack-md">
  <div class="row-between">
    <div class="row-wrap">
      <div data-ref="search-slot"></div>
      <select class="select-control text-xs" style="width:auto;min-width:11rem" data-ref="type-select">
        <option value="Todos">Todos los tipos</option>
        <option value="Estándar">Estándar</option>
        <option value="Superior">Superior</option>
        <option value="Deluxe Vista Mar">Deluxe Vista Mar</option>
        <option value="Suite Junior">Suite Junior</option>
        <option value="Suite Presidencial">Suite Presidencial</option>
      </select>
    </div>
    <button type="button" class="btn btn-teal btn-sm hidden" data-ref="new-room-btn">
      <span data-ref="plus-icon"></span>
      <span>Nueva habitación</span>
    </button>
  </div>

  <div class="card">
    <div class="table-scroll">
      <table class="erp-table">
        <thead>
          <tr>
            <th>Hab. / Piso</th>
            <th>Tipo y Capacidad</th>
            <th>Características</th>
            <th class="text-right">Tarifa Base</th>
            <th>Estado Comercial</th>
            <th>Estado Físico</th>
            <th class="text-right hidden" data-ref="actions-th">Acciones</th>
          </tr>
        </thead>
        <tbody data-ref="tbody"></tbody>
      </table>
    </div>
    <div data-ref="pagination-slot"></div>
  </div>
</div>

<template data-tpl="fila-habitacion">
  <tr>
    <td class="font-mono">
      <strong class="text-navy" data-ref="number"></strong>
      <span class="text-slate-400" data-ref="floor"></span>
    </td>
    <td>
      <div class="font-semibold text-navy" data-ref="type"></div>
      <div class="text-11 text-slate-500" data-ref="capacity"></div>
    </td>
    <td class="text-xs text-slate-600" data-ref="features"></td>
    <td class="text-right font-mono font-semibold text-navy" data-ref="rate"></td>
    <td data-ref="commercial-status"></td>
    <td data-ref="hk-status"></td>
    <td class="text-right hidden" data-ref="actions-td">
      <button type="button" class="btn btn-outline btn-xs" data-ref="edit-btn">
        <span data-ref="edit-icon"></span>
        <span>Editar</span>
      </button>
    </td>
  </tr>
</template>
