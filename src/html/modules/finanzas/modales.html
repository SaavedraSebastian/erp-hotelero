<div class="module-templates" hidden>
  <template data-tpl="modal-cargo-manual">
    <form class="stack-md">
      <div>
        <label class="field-label">Concepto</label>
        <input class="input-control" required placeholder="Ej. Late check-out / Lavandería express" data-ref="description" />
      </div>
      <div class="grid-2">
        <div>
          <label class="field-label">Categoría</label>
          <select class="select-control" data-ref="category">
            <option value="Servicios">Servicios</option>
            <option value="Alojamiento">Alojamiento</option>
            <option value="Restaurante">Restaurante</option>
            <option value="Minibar">Minibar</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
        <div>
          <label class="field-label">Importe (S/)</label>
          <input type="number" step="0.5" min="1" class="input-control font-mono" data-ref="amount" />
        </div>
      </div>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Cargar al folio</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-comprobante">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Tipo comprobante</label>
          <select class="select-control" data-ref="type">
            <option value="Boleta">Boleta</option>
            <option value="Factura">Factura</option>
            <option value="Nota de Crédito">Nota de Crédito</option>
          </select>
        </div>
        <div>
          <label class="field-label">Folio vinculado</label>
          <select class="select-control" data-ref="folio"></select>
        </div>
        <div>
          <label class="field-label">Cliente / Razón Social</label>
          <input class="input-control" required data-ref="customer-name" />
        </div>
        <div>
          <label class="field-label">DNI / RUC</label>
          <input class="input-control font-mono" required data-ref="customer-doc" />
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label class="field-label">Glosa</label>
          <input class="input-control" data-ref="description" />
        </div>
        <div>
          <label class="field-label">Importe Total inc. IGV (S/)</label>
          <input type="number" step="0.5" min="1" class="input-control font-mono" required data-ref="amount" />
        </div>
      </div>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Generar comprobante</button>
      </div>
    </form>
  </template>

  <template data-tpl="modal-vista-comprobante">
    <div class="stack-md">
      <div class="p-4 border rounded-md bg-subtle stack-xs text-xs">
        <div class="row-between">
          <strong class="text-navy">Hotel Boulevard S.A.C.</strong>
          <span class="font-mono text-slate-500">RUC 20601234561</span>
        </div>
        <div data-ref="buyer"></div>
        <div class="text-11 text-warning" data-ref="sunat-status"></div>
      </div>
      <div class="table-scroll">
        <table class="erp-table">
          <thead>
            <tr>
              <th>Descripción</th>
              <th class="text-right">Total</th>
            </tr>
          </thead>
          <tbody data-ref="items-tbody"></tbody>
        </table>
      </div>
      <div class="p-3 border rounded-md stack-xs text-xs font-mono">
        <div class="row-between">
          <span>Op. Gravada:</span>
          <span data-ref="subtotal"></span>
        </div>
        <div class="row-between">
          <span>IGV (18%):</span>
          <span data-ref="igv"></span>
        </div>
        <div class="row-between font-bold text-navy text-sm pt-1 border-t-soft">
          <span>TOTAL:</span>
          <span data-ref="total"></span>
        </div>
      </div>
      <div class="row-wrap justify-end">
        <button type="button" class="btn btn-outline" data-ref="print-btn">
          <span data-ref="print-icon"></span>
          <span>Imprimir</span>
        </button>
        <button type="button" class="btn btn-primary" data-ref="close-btn">Cerrar</button>
      </div>
    </div>
  </template>

  <template data-tpl="fila-item-comprobante">
    <tr>
      <td data-ref="desc"></td>
      <td class="text-right font-mono" data-ref="amount"></td>
    </tr>
  </template>

  <template data-tpl="modal-gasto">
    <form class="stack-md">
      <div class="grid-2">
        <div>
          <label class="field-label">Categoría</label>
          <select class="select-control" data-ref="category">
            <option value="Compras Insumos">Compras Insumos</option>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="Servicios Básicos">Servicios Básicos</option>
            <option value="Planilla">Planilla</option>
            <option value="Marketing">Marketing</option>
            <option value="Impuestos">Impuestos</option>
          </select>
        </div>
        <div>
          <label class="field-label">Centro de Costos</label>
          <select class="select-control" data-ref="cost-center">
            <option value="Alojamiento">Alojamiento</option>
            <option value="Alimentos y Bebidas">Alimentos y Bebidas</option>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="Administración">Administración</option>
            <option value="Comercial">Comercial</option>
          </select>
        </div>
        <div>
          <label class="field-label">Proveedor</label>
          <input class="input-control" required data-ref="supplier" />
        </div>
        <div>
          <label class="field-label">Doc. Referencia</label>
          <input class="input-control font-mono" data-ref="doc-ref" />
        </div>
        <div>
          <label class="field-label">Monto (S/)</label>
          <input type="number" step="0.5" min="1" class="input-control font-mono" data-ref="amount" />
        </div>
        <div>
          <label class="field-label">Estado</label>
          <select class="select-control" data-ref="status">
            <option value="Pagado">Pagado</option>
            <option value="Pendiente">Pendiente</option>
          </select>
        </div>
      </div>
      <div>
        <label class="field-label">Descripción</label>
        <input class="input-control" required data-ref="description" />
      </div>
      <div class="row-wrap justify-end pt-2">
        <button type="button" class="btn btn-outline-muted" data-ref="cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Registrar gasto</button>
      </div>
    </form>
  </template>
</div>
