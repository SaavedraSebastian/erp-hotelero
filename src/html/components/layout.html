<div class="erp-shell">
  <aside class="erp-sidebar-desktop" data-ref="desktop-sidebar"></aside>
  <div data-ref="mobile-drawer"></div>

  <div class="erp-main-column">
    <header class="erp-topbar">
      <div class="topbar-left">
        <button type="button" class="mobile-menu-btn" data-ref="mobile-menu-btn" aria-label="Abrir navegación"></button>
        <div class="topbar-search-wrap">
          <span data-ref="search-icon"></span>
          <input
            type="text"
            class="topbar-search-input"
            data-ref="search-input"
            placeholder="Buscar reserva, habitación, huésped, folio o incidencia..."
          />
          <div class="topbar-search-dropdown hidden" data-ref="search-dropdown"></div>
        </div>
      </div>

      <div class="topbar-right">
        <div class="hidden" data-ref="site-selector-wrap">
          <label class="sr-only" for="active-site-select">Sede activa</label>
          <select id="active-site-select" class="select-control text-xs" data-ref="site-selector"></select>
        </div>
        <div class="popover-anchor" data-ref="notif-anchor"></div>
        <div class="popover-anchor" data-ref="profile-anchor"></div>
      </div>
    </header>

    <main class="erp-viewport" data-ref="viewport"></main>
  </div>
</div>

<template data-tpl="sidebar-panel">
  <div class="sidebar-panel">
    <div class="sidebar-brand-row">
      <button type="button" class="sidebar-brand-link" data-ref="brand-btn">
        <div class="brand-mark" data-ref="brand-icon"></div>
        <span class="brand-wordmark">Hotel Boulevard</span>
      </button>
      <button type="button" class="sidebar-close-btn hidden" data-ref="close-btn" aria-label="Cerrar menú"></button>
    </div>
    <nav class="sidebar-nav" aria-label="Navegación principal" data-ref="nav"></nav>
  </div>
</template>

<template data-tpl="nav-item">
  <div>
    <div class="nav-item-row">
      <button type="button" class="nav-item-link" data-ref="link-btn">
        <span data-ref="icon"></span>
        <span class="truncate" data-ref="label"></span>
      </button>
      <button type="button" class="nav-expand-btn hidden" data-ref="expand-btn"></button>
    </div>
    <div class="nav-submenu hidden" data-ref="submenu"></div>
  </div>
</template>

<template data-tpl="mobile-drawer">
  <div class="mobile-drawer-overlay">
    <div class="mobile-drawer-panel" data-ref="panel"></div>
    <div class="mobile-drawer-backdrop" data-ref="backdrop"></div>
  </div>
</template>

<template data-tpl="notif-trigger">
  <button type="button" class="notif-bell-btn" aria-label="Notificaciones entre módulos">
    <span data-ref="icon"></span>
    <span class="notif-badge hidden" data-ref="badge"></span>
  </button>
</template>

<template data-tpl="notif-popover">
  <div class="notif-popover">
    <div class="notif-popover-header">
      <span class="text-xs font-bold text-navy">Notificaciones entre módulos</span>
      <button type="button" class="btn-link-teal text-11" data-ref="mark-all-btn">Marcar leídas</button>
    </div>
    <div class="notif-popover-list" data-ref="list"></div>
  </div>
</template>

<template data-tpl="notif-item">
  <button type="button" class="notif-item">
    <div class="row-between gap-2">
      <span class="text-xs font-semibold text-navy" data-ref="title"></span>
      <span class="text-2xs font-mono font-semibold text-teal shrink-0 hidden" data-ref="tag"></span>
    </div>
    <p class="text-11 text-slate-600 mt-0.5" data-ref="message"></p>
    <div class="text-2xs text-slate-400 mt-1 font-mono" data-ref="timestamp"></div>
  </button>
</template>

<template data-tpl="profile-trigger">
  <button type="button" class="profile-trigger">
    <span data-ref="avatar-slot"></span>
    <div class="profile-meta-inline">
      <div class="text-xs font-semibold text-navy" data-ref="name"></div>
      <div class="text-11 text-slate-500" data-ref="role"></div>
    </div>
    <span data-ref="chevron"></span>
  </button>
</template>

<template data-tpl="profile-popover">
  <div class="profile-popover">
    <div class="profile-popover-head">
      <div class="text-xs font-bold text-navy" data-ref="name"></div>
      <div class="text-11 text-teal font-semibold" data-ref="role"></div>
      <div class="text-11 text-slate-400 font-mono" data-ref="email"></div>
    </div>
    <div class="profile-popover-actions">
      <button type="button" class="profile-action-btn text-slate-700 hidden" data-ref="config-btn">
        <span data-ref="config-icon"></span>
        <span>Configuración y Matriz RBAC</span>
      </button>
      <button type="button" class="profile-action-btn is-danger" data-ref="logout-btn">
        <span data-ref="logout-icon"></span>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </div>
</template>

<template data-tpl="search-result">
  <button type="button" class="search-result-btn">
    <div class="search-result-title" data-ref="title"></div>
    <div class="search-result-sub" data-ref="subtitle"></div>
  </button>
</template>

<template data-tpl="toast-item">
  <div class="toast-item">
    <div class="min-w-0 flex-1">
      <div class="toast-title" data-ref="title"></div>
      <div class="toast-detail hidden" data-ref="detail"></div>
    </div>
    <button type="button" class="toast-close" aria-label="Cerrar notificación" data-ref="close-btn"></button>
  </div>
</template>
